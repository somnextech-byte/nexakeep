<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaKeep v2.1.0 APK Assembler</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1220;color:#e6e8f0;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.card{background:#1a1e33;border:1px solid #2c3150;border-radius:16px;padding:32px;max-width:520px;width:100%;text-align:center}
h1{font-size:22px;margin:0 0 6px}
.sub{color:#9aa3c0;margin-bottom:24px;font-size:14px}
.btn{display:inline-block;background:#4f6ef7;color:#fff;border:none;border-radius:10px;padding:14px 22px;font-size:15px;cursor:pointer;margin:8px 6px;width:calc(50% - 14px);text-decoration:none}
.btn.small{font-size:13px;padding:10px 14px;width:auto}
#log{margin-top:20px;font-size:13px;color:#b9c1dd;text-align:left;white-space:pre-wrap;min-height:60px;border-top:1px solid #2c3150;padding-top:14px}
.progress{height:8px;background:#2c3150;border-radius:4px;margin-top:10px;overflow:hidden;display:none}
.progress div{height:100%;width:0;background:#4f6ef7;transition:width .2s}
</style>
</head>
<body>
<div class="card">
  <h1>NexaKeep <span class="sub" style="margin-left:8px">v2.1.0</span></h1>
  <p class="sub">Assembles the official APK from parts stored in the GitHub repository, then downloads it to your phone/computer.</p>
  <button class="btn" onclick="assemble('online')">Download Online APK</button>
  <button class="btn" onclick="assemble('offline')">Download Offline APK</button>
  <div class="progress"><div id="bar"></div></div>
  <div id="log"></div>
</div>
<script>
const COUNTS = { online: 9, offline: 6 };
const NAMES  = { online: "nexakeep.apk", offline: "nexakeep-offline.apk" };
const BASE   = "https://cdn.jsdelivr.net/gh/somnextech-byte/nexakeep@main/apk";
const log = document.getElementById("log");
const bar = document.getElementById("bar");
const pbar = document.querySelector(".progress");

const q = new URLSearchParams(location.search).get("variant");
function pad(n){ return String(n).padStart(3, "0"); }

async function assemble(variant) {
  document.querySelector(".progress").style.display = "block";
  log.textContent = "Downloading parts (0/" + COUNTS[variant] + ")...";
  parts = [];
  for (let i = 0; i < COUNTS[variant]; i++) {
    const url = BASE + "/" + variant + "/" + pad(i);
    for (let tryN = 1; tryN <= 3; tryN++) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error("HTTP " + r.status);
        parts.push(await r.arrayBuffer());
        break;
      } catch (e) {
        if (tryN === 3) { log.textContent = "Failed to fetch " + url + "\nCheck your internet connection and retry."; return; }
        await new Promise(res => setTimeout(res, 1500));
      }
    }
    bar.style.width = ((i + 1) / COUNTS[variant] * 100 | 0) + "%";
    log.textContent = "Downloading parts (" + (i + 1) + "/" + COUNTS[variant] + ")...";
  }
  log.textContent = "Joining parts...";
  const blob = new Blob(parts, { type: "application/vnd.android.package-archive" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = NAMES[variant];
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(a.href);
  bar.style.width = "100%";
  log.textContent = "Done! " + NAMES[variant] + " (" + (blob.size / 1024 / 1024 | 0) + " MB) downloaded.";
}
if (q) assemble(q);
</script>
</body>
</html>
