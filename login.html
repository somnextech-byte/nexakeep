<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Somnex Digimark</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <div style="display: flex; align-items: center; justify-content: center; position: relative; gap: 16px;">
                    <a href="index.html" class="logo">
                        <img src="images/logo.png" alt="Somnex Digimark Logo">
                    </a>
                </div>
                <h2 data-i18n="login_welcome">Welcome Back</h2>
                <p data-i18n="login_subtitle">Please enter your details to sign in.</p>
            </div>

            <form class="auth-form">
                <div class="form-group">
                    <label for="email" data-i18n="login_email">Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="login_password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                    </label>
                    <a href="#" class="forgot-password" data-i18n="login_forgot">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="login_signin">Sign In</button>

                <div class="auth-divider">
                    <span data-i18n="login_or">OR</span>
                </div>

                <button type="button" class="btn btn-white btn-block google-btn">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                    <span data-i18n="login_google">Sign in with Google</span>
                </button>
            </form>

            <div class="auth-footer">
                <p><span data-i18n="login_no_account">Don't have an account?</span> <a href="signup.html" data-i18n="login_signup">Sign up</a></p>
                <div style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px;">
                    <p style="font-size: 0.85rem; color: var(--text-muted);"><span data-i18n="login_help">Need help?</span> <a href="mailto:somnextech@gmail.com"
                            style="color: var(--primary); font-weight: 500;">somnextech@gmail.com</a></p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="firebase-auth.js"></script>
    <script type="module" src="main.js"></script>
    <script>
        // Apply theme immediately from localStorage so the page doesn't flash white
        (function () {
            const theme = localStorage.getItem('theme');
            if (theme) document.documentElement.dataset.theme = theme;
        })();
    </script>
</body>

</html>
