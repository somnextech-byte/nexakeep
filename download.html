<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaKeep v2.1.0 — Download APK</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a0d1c;color:#e7e9f4;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.card{background:#12162b;border:1px solid #242a4d;border-radius:18px;padding:30px;max-width:520px;width:100%;text-align:center}
h1{margin:0 0 6px;font-size:24px}
.sub{color:#8f98c4;font-size:14px;margin:0 0 22px}
.btn{display:block;width:100%;box-sizing:border-box;background:#3f5bf5;color:#fff;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;margin:8px 0}
.btn.off{background:#7c4df0}
.btn.green{background:#1fbf57;display:none}
.btn.gray{background:#313a63;font-size:13px;display:none;margin-top:2px}
.pwrap{background:#1b2140;border-radius:8px;height:9px;overflow:hidden;margin:14px 0 4px;display:none}
.pwrap div{height:100%;width:0;background:#3f5bf5}
#log{margin-top:16px;font-size:13px;color:#aab3dc;text-align:left;white-space:pre-wrap;min-height:70px;border-top:1px solid #242a4d;padding-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>NexaKeep <span style="font-size:13px;color:#6c769f">v2.1.0</span></h1>
  <p class="sub">Tap a button. The APK is assembled from parts stored in the repository and downloads automatically to this device.</p>
  <button class="btn" onclick="go('online')">Download Online APK</button>
  <button class="btn off" onclick="go('offline')">Download Offline APK</button>
  <div class="pwrap"><div id="bar"></div></div>
  <button class="btn green" id="saveBtn" onclick="saveBlob()">Save APK</button>
  <button class="btn gray" id="shareBtn" onclick="shareBlob()">Share / Save to Files (iPhone)</button>
  <div id="log">Tap one of the buttons above. Keep this tab open until the download finishes.</div>
</div>
<script>
var COUNTS = { online: 137, offline: 86 };
var NAMES  = { online: "nexakeep.apk", offline: "nexakeep-offline.apk" };
var BASE   = "https://somnextech-byte.github.io/nexakeep/apk";
var logEl    = document.getElementById("log");
var barEl    = document.getElementById("bar");
var saveBtn  = document.getElementById("saveBtn");
var shareBtn = document.getElementById("shareBtn");
var parts = [];
var blob;
var variant;

function pad(n){ return ("000" + n).slice(-3); }
function setLog(m){ logEl.textContent = m; }

function fetchRetry(u, tryN){
  tryN = tryN || 1;
  return fetch(u, { cache: "no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.arrayBuffer();
  }).catch(function(e){
    if (tryN >= 8) throw e;
    return new Promise(function(res){ setTimeout(function(){
      res(fetchRetry(u, tryN + 1));
    }, 1400 * tryN); });
  });
}

function firstAvail(queue){
  return queue.length ? queue.shift() : null;
}

function startPool(urls, workers, onOne, done) {
  var i = 0;
  var results = new Array(urls.length);
  function next(){
    if (done.cancelled) return;
    if (i >= urls.length) return;
    var idx = i++;
    fetchRetry(urls[idx]).then(function(buf){
      results[idx] = buf;
      onOne && onOne(idx, results.length);
      next();
    }).catch(function(e){
      done.fail = urls[idx] + " -> " + e.message;
      if (done.onfail) done.onfail(urls[idx], e);
    });
    next();
  }
  for (var w = 0; w < workers; w++) next();
  return function(){ return results; };
}

async function go(v) {
  variant = v;
  parts = [];
  blob = null;
  saveBtn.style.display = "none";
  shareBtn.style.display = "none";
  barEl.parentNode.style.display = "block";
  barEl.style.width = "0%";
  setLog("Downloading " + COUNTS[v] + " parts...\n(The APK is ~" + (v === "online" ? 84 : 52) + " MB, split into 614 KB parts. This takes about a minute — please keep this tab open.)");

  var urls = [];
  for (var i = 0; i < COUNTS[v]; i++) urls.push(BASE + "/" + v + "/" + pad(i));

  var done = { cancelled: false, fail: null, onfail: null };
  var total = 0;
  var workers = 4;
  var started = 0;

  try {
    var results = await new Promise(function(resolve, reject) {
      var doneCount = 0;
      var INDEX = [];
      done.onfail = function(u, e) {
        reject(new Error(u + " -> " + e.message));
      };
      var go2 = function() {
        if (started >= urls.length) return;
        var idx = started++;
        fetchRetry(urls[idx]).then(function(buf){
          INDEX[idx] = buf;
          doneCount++;
          barEl.style.width = Math.round(doneCount / urls.length * 100) + "%";
          setLog("Downloading parts (" + doneCount + "/" + urls.length + ")...\nKeep this tab open.");
          if (doneCount === urls.length) {
            var ordered = [];
            for (var k = 0; k < urls.length; k++) ordered.push(INDEX[k]);
            resolve(ordered);
          } else {
            go2();
          }
        }).catch(function(e){
          reject(new Error(urls[idx] + " -> " + e.message));
        });
        go2();
      };
      for (var w = 0; w < workers && w < urls.length; w++) go2();
    });

    setLog("Joining " + urls.length + " parts...");
    blob = new Blob(results, { type: "application/vnd.android.package-archive" });
    barEl.style.width = "100%";
    setLog("Done! " + (blob.size / 1048576 | 0) + " MB APK assembled.\nDownloading now — if nothing happens, tap the green Save APK button (or Share on iPhone).");
    saveBtn.style.display = "block";
    shareBtn.style.display = "block";
    saveBlob();
  } catch (e) {
    setLog("Download failed: " + e.message + "\n\nYour internet connection may have dropped or is slow. Tap the button to try again.\nIf it keeps failing, use a PC (PowerShell method) — it always works.");
  }
}

function saveBlob(){
  if (!blob) return;
  try {
    var u = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = u;
    a.download = NAMES[variant];
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 4000);
  } catch (e) {}
}

function shareBlob(){
  if (!blob) return;
  var f = new File([blob], NAMES[variant], { type: "application/vnd.android.package-archive" });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    navigator.share({ files: [f] }).catch(function(){});
  } else {
    setLog("Sharing isn't supported by this browser. Use the green Save APK button (or on iPhone, long-press the link and choose Save Link / Save to Files).");
  }
}
</script>
</body>
</html>
